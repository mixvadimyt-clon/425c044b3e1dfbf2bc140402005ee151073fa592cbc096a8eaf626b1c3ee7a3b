# Приём JSON-логов сервисов (REQ-MON-06). Сервисы шлют строки JSON по TCP при LOGSTASH_HOST.
input {
  tcp { port => 5044 codec => json_lines }
}
filter {
  date { match => ["timestamp", "ISO8601", "UNIX_MS"] target => "@timestamp" }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "inspector-%{[service]}-%{+YYYY.MM.dd}"
  }
}
