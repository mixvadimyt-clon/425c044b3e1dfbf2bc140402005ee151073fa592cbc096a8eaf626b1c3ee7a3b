global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: rabbitmq          # размер очередей (REQ-MON-04)
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000", "host.docker.internal:3000"]
  - job_name: ml
    metrics_path: /metrics
    static_configs:
      - targets: ["ml:8000", "host.docker.internal:8000"]
  - job_name: cadvisor          # CPU/RAM по контейнерам (профиль observability)
    static_configs:
      - targets: ["cadvisor:8080"]
